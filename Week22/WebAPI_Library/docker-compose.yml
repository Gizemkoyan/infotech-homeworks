services:
  postgres:
    image: postgres:17
    container_name: week22_library_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lib_db
      POSTGRES_USER: lib_user
      POSTGRES_PASSWORD: lib_password
    ports:
      - "12100:5432"
    volumes:
      - library_postgres_data:/var/lib/postgresql/data

volumes:
  library_postgres_data:
