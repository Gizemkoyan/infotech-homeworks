services:
  postgres:
    image: postgres:17
    container_name: week13_fitness_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: week13_fitness_db
      POSTGRES_USER: fitness_user
      POSTGRES_PASSWORD: fitness123
    ports:
      - "5437:5432"
    volumes:
      - fitness_postgres_data:/var/lib/postgresql/data

volumes:
  fitness_postgres_data: