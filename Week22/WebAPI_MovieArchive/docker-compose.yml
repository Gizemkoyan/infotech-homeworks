services:
  postgres:
    image: postgres:17
    container_name: week22_movie_postgres
    environment:
      POSTGRES_DB: movie_db
      POSTGRES_USER: movie_user
      POSTGRES_PASSWORD: movie_password
    ports:
      - "12200:5432"
    volumes:
      - movie_postgres_data:/var/lib/postgresql/data

volumes:
  movie_postgres_data: